name: Deploy GitHub Pages

# Deploy automatically whenever main changes, while keeping manual deployment available.
# This makes normal fixes and updates visible on GitHub Pages without a separate deploy-trigger commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run pre-deploy checks
        run: python3 scripts/predeploy_check.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/shift-browser --no-save --package-lock=false playwright@1.62.1
          /tmp/shift-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify published app in mobile and desktop browser
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PLAYWRIGHT_MODULE: /tmp/shift-browser/node_modules/playwright
        run: node scripts/browser-smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-evidence
          path: browser-report
          if-no-files-found: ignore
          retention-days: 7
