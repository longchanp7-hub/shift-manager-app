name: Deploy GitHub Pages

# Manual deployment is still available. In addition, changing only the
# dedicated deploy-trigger file starts a deployment, so ChatGPT can publish
# after the user explicitly asks for it without enabling auto-deploy on normal pushes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/deploy-trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run pre-deploy checks
        run: python3 scripts/predeploy_check.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
