name: Pre-deploy checks

# Final verification gate for the Level 1 customization build before any manual Pages deployment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run pre-deploy checks
        run: python3 scripts/predeploy_check.py
